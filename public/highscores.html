<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Scores</title>
    <style>
      body { font-family: system-ui, sans-serif; background:#111; color:#eee; padding:20px; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      table { border-collapse: collapse; width: 100%; max-width: 520px; }
      th, td { border-bottom: 1px solid #333; padding: 8px 10px; text-align: left; }
      th { color:#aaa; font-weight: 600; }
      .rank { width: 44px; }
      .score { text-align: right; }
    </style>
  </head>
  <body>
    <h1>High Scores</h1>
    <table>
      <thead><tr><th class="rank">#</th><th>Name</th><th class="score">Score</th><th>When</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody>
    </table>
    <script>
      async function load() {
        try {
          const res = await fetch('/api/highscores', { cache: 'no-store' });
          const data = await res.json();
          const rows = (data.top || []).map((e, i) => {
            const d = new Date(e.timestamp || Date.now());
            const when = isNaN(d) ? '' : d.toLocaleString();
            return `<tr><td class="rank">${i+1}</td><td>${(e.name||'').toString().substring(0,32)}</td><td class="score">${e.score||0}</td><td>${when}</td></tr>`;
          }).join('');
          document.getElementById('rows').innerHTML = rows || '<tr><td colspan="4">No scores yet.</td></tr>';
        } catch (e) {
          document.getElementById('rows').innerHTML = '<tr><td colspan="4">Failed to load.</td></tr>';
        }
      }
      load();
    </script>
  </body>
  </html>
